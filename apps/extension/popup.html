<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PDI+ — Sincronizar</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 400px;
        padding: 14px;
        color: #27272a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 6px;
        color: #e8590c;
      }
      p {
        font-size: 11px;
        color: #71717a;
        margin: 0 0 10px;
        line-height: 1.4;
      }
      label {
        font-size: 11px;
        font-weight: 600;
        color: #52525b;
        display: block;
        margin-bottom: 3px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      button {
        background: #e8590c;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: white;
        color: #27272a;
        border: 1px solid #d4d4d8;
        width: auto;
        font-weight: 500;
        font-size: 11px;
        padding: 5px 10px;
        margin-top: 8px;
      }
      #status {
        font-size: 11px;
        margin-top: 10px;
        color: #71717a;
        min-height: 14px;
        line-height: 1.4;
      }
      #status.error {
        color: #dc2626;
      }
      #status.ok {
        color: #059669;
        font-weight: 600;
      }
      details {
        margin-top: 10px;
      }
      summary {
        font-size: 11px;
        color: #71717a;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        height: 140px;
        margin-top: 6px;
        font-family: monospace;
        font-size: 10px;
        box-sizing: border-box;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h1>PDI+ — Sincronizar</h1>
    <p>
      Abra a página do seu PDI (".../my-idp") no Qulture.rocks antes de
      clicar. Isto lê a página, abre o PDI+ numa aba já logada e preenche o
      formulário de importação sozinho — não envia nada direto pela rede.
    </p>
    <label for="url">URL do PDI+</label>
    <input id="url" type="text" placeholder="http://localhost:3000" />
    <button id="run">Criar PDI+</button>
    <div id="status"></div>
    <details>
      <summary>Ver tabela extraída (avançado / depuração)</summary>
      <textarea id="out" readonly></textarea>
      <button id="copy" class="secondary" disabled>Copiar</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
